name: Notify Downstream

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dijkstra sync
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DOWNSTREAM_TOKEN }}" \
            https://api.github.com/repos/juniqu-e/dijkstra/dispatches \
            -d '{"event_type": "upstream-updated", "client_payload": {"ref": "${{ github.sha }}"}}'
